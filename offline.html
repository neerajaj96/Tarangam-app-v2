<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarangam — Offline</title>
<meta name="description" content="Tarangam offline fallback: cached pages remain available, progress stays on this device.">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f17; color: #f1f5f9; font-family: 'Space Grotesk', system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; text-align: center; }
  .mark { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 14px; background: #38bdf8; color: #030712; font-size: 28px; font-weight: 700; }
  h1 { font-size: 24px; margin: 18px 0 8px; }
  p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  a { color: #38bdf8; text-decoration: none; font-size: 14px; border: 1px solid #1e293b; background: #121824; border-radius: 8px; padding: 10px 16px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; }
  @media (max-width: 640px) { .wrap { padding: 32px 14px 60px; } h1 { font-size: 20px; } }
</style>
</head>
<body>
<main class="wrap">
  <span class="mark">त</span>
  <h1>You are offline</h1>
  <p>Tarangam could not reach the network, and this page is not in the offline cache yet. Pages you have already visited remain available. Your learning progress is stored only on this device and is unaffected.</p>
  <div class="row">
    <a href="./index.html">Home</a>
    <a href="./dashboard.html">Dashboard</a>
    <a href="./explorer.html">Explorer</a>
  </div>
</main>
</body>
</html>
