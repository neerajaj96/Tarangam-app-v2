name: Deploy Tarangam to GitHub Pages

# Deterministic static-first Pages deployment: push to the default branch
# (or manual dispatch) builds the generated site, validates it through the
# existing quality gate (build → test → lint, each failing the job), then
# publishes only the generated dist/ directory via the official Pages
# actions. No backend, no cloud application behavior, no source deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the CI quality gate toolchain (local Node v22,
          # @types/node ^22) so build output is identical in both workflows.
          node-version: 22
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build static notes & assets
        # Runs scripts/build.js (generates dist/) then scripts/check.js.
        # Runs before the tests so smoke suites validate the fresh output.
        run: npm run build:notes

      - name: Run test suites
        run: npm test

      - name: Lint (typecheck)
        run: npm run lint

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
