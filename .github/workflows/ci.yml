name: CI quality gate

# Automated quality gate: every push and pull request is checked against the
# project's existing integrity, build, performance, accessibility,
# responsive, PWA, assessment, learner-state, and backup/restore suites.
# The workflow delegates all logic to the existing deterministic commands
# (npm run build:notes / npm test / npm run lint) and duplicates none of
# scripts/check.js. The build runs before the tests so the generated-site
# smoke suite always validates a freshly generated dist/. Any failing
# command fails the job. No deployment here — Pages releases ship through
# the separate .github/workflows/deploy-pages.yml workflow.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the project's current development/runtime toolchain
          # (local Node v22, @types/node ^22).
          node-version: 22
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Build notes and run content QA gate
        # Runs scripts/build.js (generates dist/) then scripts/check.js,
        # which verifies dist/ output, performance budgets, PWA assets,
        # learner-state integrity, and backup/restore safeguards. Runs
        # before npm test so smoke tests validate the fresh output.
        run: npm run build:notes

      - name: Run test suites
        run: npm test

      - name: Lint (typecheck)
        run: npm run lint
