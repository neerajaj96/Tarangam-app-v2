<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarangam — Self-Assessment</title>
<meta name="description" content="Check your understanding with short deterministic quizzes drawn from the Tarangam KTU curriculum. No accounts, no backend — results stay in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body[data-theme="dark"] { color-scheme: dark; }
  .xp-shell { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; font-family: var(--font-display); }
  .xp-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .xp-top h1 { font-size: 24px; margin: 0; letter-spacing: -0.3px; }
  .xp-back { margin-left: auto; font-size: 13px; color: var(--accent); text-decoration: none; font-family: var(--font-mono); }
  .xp-status { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); margin: 0 0 18px; }
  .xp-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .xp-controls label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-family: var(--font-mono); color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .xp-controls select, .xp-controls input { background: var(--surface); border: 1px solid var(--border); color: var(--ink); border-radius: var(--radius-md); padding: 10px 12px; font-size: 14px; font-family: var(--font-display); }
  .xp-path { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 18px; }
  .xp-path h2 { font-size: 12px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-dim); margin: 0 0 10px; }
  .xp-path-next { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .xp-path-title { font-weight: 700; font-size: 16px; }
  .xp-path-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
  .xp-path-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink); border-radius: var(--radius-sm); padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: var(--font-display); }
  .xp-path-btn:hover { border-color: var(--accent); }
  .xp-path-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .xp-path-label { font-size: 12px; color: var(--ink-dim); }
  .xp-empty { border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 24px; color: var(--ink-dim); font-size: 14px; }
  .xp-error { border: 1px solid var(--wrong); background: var(--wrong-bg); border-radius: var(--radius-md); padding: 18px; margin-bottom: 18px; }
  .xp-error button { margin-top: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink); border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; }
  .xp-open { color: var(--accent); text-decoration: none; font-size: 14px; }
  .xp-none { color: var(--ink-faint); font-size: 13px; }
  .as-q { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 12px; }
  .as-q-title { font-weight: 600; font-size: 15px; margin: 0 0 4px; }
  .as-q-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); margin-bottom: 10px; }
  .as-opts { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .as-opt { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; cursor: pointer; font-family: var(--font-display); color: var(--ink); text-align: left; width: 100%; }
  .as-opt:hover { border-color: var(--accent); }
  .as-opt[disabled] { cursor: default; opacity: 0.85; }
  .as-opt.as-picked { border-color: var(--accent); }
  .as-opt.as-right { border-color: var(--correct); }
  .as-opt.as-wrong { border-color: var(--wrong); }
  .as-text { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px; font-family: var(--font-display); width: 100%; box-sizing: border-box; }
  .as-feedback { font-size: 13px; margin-top: 10px; }
  .xp-path-btn, .as-opt { min-height: 44px; }
  .as-q-title { overflow-wrap: break-word; }
  .as-opt { overflow-wrap: break-word; }
  @media (max-width: 640px) {
    .xp-shell { padding: 20px 14px 60px; }
    .xp-top h1 { font-size: 20px; }
    .as-q { padding: 14px; }
  }
  .as-feedback.ok { color: var(--correct); }
  .as-feedback.no { color: var(--wrong); }
  .as-explain { font-size: 13px; color: var(--ink-dim); margin-top: 6px; }
</style>
</head>
<body data-theme="dark" data-size="md">
<div class="xp-shell">
  <div class="xp-top">
    <a href="./index.html" class="brand" style="text-decoration:none;">
      <span class="brand-mark">त</span>
      <span class="brand-text"><span class="brand-name">Tarangam</span></span>
    </a>
    <h1>Self-Assessment</h1>
    <a class="xp-back" href="./index.html">← Dashboard</a>
    <a class="xp-back" href="./explorer.html">Explorer →</a>
  </div>
  <p class="xp-status" id="as-status">Loading curriculum…</p>

  <div class="xp-error" id="as-error" hidden>
    <strong>Could not load the curriculum data.</strong>
    <div id="as-error-msg" style="margin-top:6px;font-size:13px;"></div>
    <button id="as-retry" type="button">Retry</button>
  </div>

  <div id="as-app" hidden>
    <section class="xp-path" aria-label="Assessment scope">
      <h2>Choose what to check</h2>
      <div class="xp-controls">
        <label>Scope
          <select id="as-scope">
            <option value="topic">Single topic</option>
            <option value="module">Whole module</option>
            <option value="course">Whole course</option>
            <option value="exam">Exam-relevant</option>
          </select>
        </label>
        <label>Course
          <select id="as-course"></select>
        </label>
        <label>Module
          <select id="as-module"></select>
        </label>
        <label>Topic
          <select id="as-topic"></select>
        </label>
        <label>Questions
          <input id="as-limit" type="number" min="1" max="50" step="1" value="5">
        </label>
      </div>
      <div class="xp-path-row">
        <button class="xp-path-btn" id="as-start" type="button">Start assessment</button>
        <span class="xp-path-meta" id="as-scope-count"></span>
      </div>
    </section>

    <section class="xp-path" id="as-result" aria-label="Assessment result" hidden></section>
    <div id="as-questions" aria-label="Questions"></div>
  </div>
</div>
<script type="module" src="assets/assessment-page.js"></script>
</body>
</html>
